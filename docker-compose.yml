version: '3.8'
services:
  web:
    build: .
    environment:
      - POSTGRES_USER=rabot_admin
    depends_on:
      - db
  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_PASSWORD=secret
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
  uptime-kuma:
    image: louislam/uptime-kuma:1
    ports:
      - "3001:3001"